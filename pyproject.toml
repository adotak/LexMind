[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexmind"
version = "0.2.0"
description = "AI legal assistant for Pakistan: answers about the law with a verified source for every claim."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
data = ["pdfplumber>=0.11"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5",
    "pre-commit>=3.7",
]

[project.scripts]
lexmind = "lexmind.cli:main"

[tool.setuptools.packages.find]
include = ["lexmind*"]

[tool.setuptools.package-data]
lexmind = ["data/*.json", "static/*", "static/js/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["lexmind", "app.py"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lexmind"]
omit = ["lexmind/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
